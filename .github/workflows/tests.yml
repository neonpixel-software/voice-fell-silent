name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fSL -o "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fSL -o /tmp/SHA512-SUMS.txt "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/SHA512-SUMS.txt"

      - name: Verify Godot integrity
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # Integrity gate: the binary is only unzipped after its SHA-512
          # matches the checksums published with the release. Fail closed if
          # the checksum entry is missing or the digest does not match.
          grep -E "^[0-9a-fA-F]+ +Godot_v${GODOT_VERSION}-stable_linux\.x86_64\.zip$" /tmp/SHA512-SUMS.txt > /tmp/godot.sums
          test -s /tmp/godot.sums
          (cd /tmp && sha512sum -c --quiet godot.sums)
          unzip -q "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d ~/godot

      - name: Import project
        run: ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --import

      - name: Run tests
        run: ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . -s res://tests/run_tests.gd
